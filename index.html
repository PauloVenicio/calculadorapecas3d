<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Venix3D - Sistema 3D</title>

<style>

*{
    box-sizing:border-box;
}

:root{
    --bg:#0a0f1f;
    --card:#111933;
    --text:#ffffff;
    --primary:#00f2ff;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:14px;
    padding-bottom:120px;
}

.card{
    background:var(--card);
    width:100%;
    padding:16px;
    border-radius:16px;
    max-width:520px;
    margin:0 auto;
    box-shadow:0 0 20px var(--primary);
}

.logo-area{
    text-align:center;
    margin-bottom:10px;
}

.logo-area img{
    max-width:180px;
    max-height:120px;
}

h2{
    text-align:center;
    color:var(--primary);
}

label{
    margin-top:12px;
    display:block;
}

input,
select{
    width:100%;
    padding:12px;
    font-size:16px;
    border-radius:10px;
    border:1px solid #555;
    margin-top:5px;
    background:transparent;
    color:var(--text);
}

select option{
    background:#111933;
}

.resultado{
    margin-top:15px;
    background:rgba(0,0,0,0.2);
    padding:12px;
    border-radius:12px;
}

.resultado:empty,
.historico:empty{
    display:none;
}

.preco-final{
    color:#00ff88;
    font-size:1.4em;
    text-align:center;
}

button{
    width:100%;
    padding:13px;
    font-size:16px;
    margin-top:10px;
    border-radius:12px;
    border:none;
    font-weight:bold;
    cursor:pointer;
}

.btn-primary{
    background:var(--primary);
    color:#000;
}

.social-links{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.social-links a{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    text-align:center;
    text-decoration:none;
    padding:14px;
    border-radius:12px;
    font-weight:bold;
    color:white;
    transition:0.3s;
    min-height:56px;
}

.social-links a:hover{
    transform:scale(1.03);
}

.instagram{
    background:linear-gradient(45deg,#833ab4,#fd1d1d,#fcb045);
}

.whatsapp{
    background:#25D366;
}

.mercadolivre{
    background:#ffe600;
    color:#000 !important;
}

.filamento-card{
    background:#0d1429;
    padding:14px;
    border-radius:12px;
    margin-bottom:10px;
    border:1px solid #1c274d;
    position:relative;
}

.btn-lixeira{
    background:#1c274d;
    color:#ff4d4d;
    border:1px solid #ff4d4d;
    width:34px;
    height:34px;
    border-radius:10px;
    position:absolute;
    top:10px;
    right:10px;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:0.25s;
    padding:0;
}

.btn-editar{
    background:#00bcd4;
    color:#fff;
    border:none;
    width:34px;
    height:34px;
    border-radius:10px;
    position:absolute;
    top:10px;
    right:52px;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:0.25s;
    padding:0;
}

.btn-lixeira:hover{
    background:#ff4d4d;
    color:#fff;
    transform:scale(1.08);
}

.btn-editar:hover{
    transform:scale(1.08);
    background:#0097a7;
}

footer{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#000;
    color:var(--primary);
    text-align:center;
    padding:10px;
    font-size:14px;
}

hr{
    border-color:#333;
    margin:20px 0;
}

#filamentoMaterial{
    text-transform:uppercase;
}

.resumo-item{
    background:#0d1429;
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
    border:1px solid #1c274d;
}

</style>
</head>

<body>

<div class="card">

<div class="logo-area">
    <img src="logo horizontal.jpg">
</div>

<h2>🖨️ Venix3D - Sistema 3D 💰</h2>

<label>Nome do objeto:</label>
<input type="text" id="nomeObjeto" placeholder="Ex.: Suporte de celular">

<label>Peso (g):</label>
<input type="number" id="peso" step="0.01">

<label>Tempo (horas):</label>
<input type="number" id="tempo" step="0.1">

<label>Preço do filamento (R$/kg):</label>
<input type="number" id="precoKg" value="130">

<label>Custo da máquina (R$/hora):</label>
<input type="number" id="custoHora" value="4">

<label>Energia (R$/kWh):</label>
<input type="number" id="energia" value="1.37">

<label>Consumo (kW):</label>
<input type="number" id="consumo" value="0.19">

<div class="resultado" id="resultado"></div>

<button class="btn-primary" onclick="calcular()">
    Calcular
</button>

<hr>

<h2>📦 Estoque de Filamentos</h2>

<label>Nome do filamento:</label>
<input type="text" id="filamentoNome" placeholder="Ex.: Voolt 3D">

<label>Material:</label>
<input type="text" id="filamentoMaterial" placeholder="PLA / PETG / ABS">

<label>Cor do filamento:</label>
<input type="text" id="filamentoCor" placeholder="Ex.: Preto / Branco / Vermelho">

<label>Peso restante (g):</label>
<input type="number" id="filamentoPeso">

<label>Status:</label>
<select id="filamentoStatus">
    <option value="Lacrado">Lacrado</option>
    <option value="Aberto">Aberto</option>
</select>

<button class="btn-primary" onclick="salvarFilamento()">
    Salvar Filamento
</button>

<div class="historico" id="estoqueFilamentos"></div>

<div class="resultado" id="resumoFilamentos"></div>

<hr>

<div class="social-links">

    <a href="https://www.instagram.com/venix3d/" target="_blank" class="instagram">
        <span>📸</span>
        <span>Instagram</span>
    </a>

    <a href="https://chat.whatsapp.com/GvUt2Y9shbt6mIBLmzPBJR" target="_blank" class="whatsapp">
        <span>💬</span>
        <span>WhatsApp</span>
    </a>

    <a href="https://meli.la/2Pj6voY" target="_blank" class="mercadolivre">
        <span>🛒</span>
        <span>Mercado Livre</span>
    </a>

</div>

</div>

<footer>
Paulo Carvalho 2026 - Todos os direitos reservados.
</footer>

<script>

const DB_NAME = "venix3d_db";
const DB_VERSION = 8;

const STORE_FILAMENTOS = "filamentos";

let db = null;

async function abrirBanco(){

    return new Promise((resolve,reject)=>{

        const request = indexedDB.open(DB_NAME,DB_VERSION);

        request.onupgradeneeded = (event)=>{

            const database = event.target.result;

            if(!database.objectStoreNames.contains(STORE_FILAMENTOS)){

                database.createObjectStore(STORE_FILAMENTOS,{
                    keyPath:"id",
                    autoIncrement:true
                });
            }
        };

        request.onsuccess = ()=>resolve(request.result);

        request.onerror = ()=>reject(request.error);
    });
}

async function inicializar(){

    db = await abrirBanco();

    carregarFilamentos();
}

async function calcular(){

    let nomeObjeto = document.getElementById("nomeObjeto").value.trim();

    let peso = parseFloat(document.getElementById("peso").value);

    let tempo = parseFloat(document.getElementById("tempo").value);

    let precoKg = parseFloat(document.getElementById("precoKg").value);

    let custoHora = parseFloat(document.getElementById("custoHora").value);

    let energia = parseFloat(document.getElementById("energia").value);

    let consumo = parseFloat(document.getElementById("consumo").value);

    if(isNaN(peso) || isNaN(tempo)){

        alert("Preencha peso e tempo corretamente.");

        return;
    }

    let custoFilamento = (precoKg / 1000) * peso;

    let custoMaquina = tempo * custoHora;

    let custoEnergia = tempo * consumo * energia;

    let custoTotal = custoFilamento + custoMaquina + custoEnergia;

    let precoFinal = custoTotal * 2.2;

    document.getElementById("resultado").innerHTML = `
    
        <p><strong>📦 Produto:</strong> ${nomeObjeto || "Sem nome"}</p>

        <p>🧵 Filamento: R$ ${custoFilamento.toFixed(2)}</p>

        <p>🖨️ Máquina: R$ ${custoMaquina.toFixed(2)}</p>

        <p>⚡ Energia: R$ ${custoEnergia.toFixed(2)}</p>

        <hr>

        <div class="preco-final">
            💰 Preço Final: R$ ${precoFinal.toFixed(2)}
        </div>
    `;
}

async function salvarFilamento(){

    let nome = document.getElementById("filamentoNome").value;

    let material = document.getElementById("filamentoMaterial").value.toUpperCase();

    let cor = document.getElementById("filamentoCor").value;

    let peso = document.getElementById("filamentoPeso").value;

    let status = document.getElementById("filamentoStatus").value;

    if(!nome || !material || !cor || !peso){

        alert("Preencha todos os dados.");

        return;
    }

    const transaction = db.transaction(STORE_FILAMENTOS,"readwrite");

    const store = transaction.objectStore(STORE_FILAMENTOS);

    store.add({
        nome,
        material,
        cor,
        peso,
        status
    });

    document.getElementById("filamentoNome").value = "";
    document.getElementById("filamentoMaterial").value = "";
    document.getElementById("filamentoCor").value = "";
    document.getElementById("filamentoPeso").value = "";

    carregarFilamentos();
}

async function excluirFilamento(id){

    if(!confirm("Deseja remover este filamento do estoque?")){
        return;
    }

    const transaction = db.transaction(STORE_FILAMENTOS,"readwrite");

    const store = transaction.objectStore(STORE_FILAMENTOS);

    store.delete(id);

    transaction.oncomplete = ()=>{
        carregarFilamentos();
    };
}

async function editarFilamento(id){

    const transaction = db.transaction(STORE_FILAMENTOS,"readonly");

    const store = transaction.objectStore(STORE_FILAMENTOS);

    const request = store.get(id);

    request.onsuccess = ()=>{

        const item = request.result;

        if(!item) return;

        document.getElementById("filamentoNome").value = item.nome;

        document.getElementById("filamentoMaterial").value = item.material;

        document.getElementById("filamentoCor").value = item.cor;

        document.getElementById("filamentoPeso").value = item.peso;

        document.getElementById("filamentoStatus").value = item.status;

        const deleteTransaction = db.transaction(STORE_FILAMENTOS,"readwrite");

        const deleteStore = deleteTransaction.objectStore(STORE_FILAMENTOS);

        deleteStore.delete(id);

        deleteTransaction.oncomplete = ()=>{

            carregarFilamentos();

        };

    };
}

async function carregarFilamentos(){

    const transaction = db.transaction(STORE_FILAMENTOS,"readonly");

    const store = transaction.objectStore(STORE_FILAMENTOS);

    const request = store.getAll();

    request.onsuccess = ()=>{

        const itens = request.result;

        const div = document.getElementById("estoqueFilamentos");

        const resumo = document.getElementById("resumoFilamentos");

        if(itens.length === 0){

            div.innerHTML = "";

            resumo.innerHTML = "";

            return;
        }

        div.innerHTML = "<b>📦 Estoque Atual:</b><br><br>";

        let abertos = 0;
        let lacrados = 0;

        let materiaisAbertos = {};
        let materiaisLacrados = {};

        itens.reverse().forEach(item=>{

            const chave = `${item.material} - ${item.cor}`;

            if(item.status === "Aberto"){

                abertos++;

                if(!materiaisAbertos[chave]){
                    materiaisAbertos[chave] = 0;
                }

                materiaisAbertos[chave]++;

            }else{

                lacrados++;

                if(!materiaisLacrados[chave]){
                    materiaisLacrados[chave] = 0;
                }

                materiaisLacrados[chave]++;
            }

            div.innerHTML += `
            
            <div class="filamento-card">

                <button 
                class="btn-editar"
                onclick="editarFilamento(${item.id})"
                title="Editar filamento">
                ✏️
                </button>

                <button 
                class="btn-lixeira"
                onclick="excluirFilamento(${item.id})"
                title="Excluir filamento">
                🗑
                </button>

                <b>${item.nome}</b><br><br>

                🧵 Material: ${item.material}<br>

                🎨 Cor: ${item.cor}<br>

                ⚖️ Peso: ${item.peso}g<br>

                📌 Status: ${item.status}

            </div>
            `;
        });

        let htmlResumo = `
        
        <h3 style="color:#00f2ff;text-align:center;">
            📊 Resumo do Estoque
        </h3>

        <div class="resumo-item">
            🔓 <b>Filamentos Abertos:</b> ${abertos}<br><br>
        `;

        for(let item in materiaisAbertos){

            htmlResumo += `
                • ${item}: ${materiaisAbertos[item]} aberto(s)<br>
            `;
        }

        htmlResumo += `
        </div>

        <div class="resumo-item">
            🔒 <b>Filamentos Lacrados:</b> ${lacrados}<br><br>
        `;

        for(let item in materiaisLacrados){

            htmlResumo += `
                • ${item}: ${materiaisLacrados[item]} lacrado(s)<br>
            `;
        }

        htmlResumo += `
        </div>
        `;

        resumo.innerHTML = htmlResumo;
    };
}

document
.getElementById("filamentoMaterial")
.addEventListener("input", function(){

    this.value = this.value.toUpperCase();

});

inicializar();

</script>

</body>
</html>
