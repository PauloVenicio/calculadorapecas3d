<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Venix3D - Sistema 3D</title>

<style>

*{
    box-sizing:border-box;
}

:root{
    --bg:#0a0f1f;
    --card:#111933;
    --text:#ffffff;
    --primary:#00f2ff;
    --footer-height:56px;
}

html{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    width:100%;
    min-height:100%;
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:14px;
    padding-left:max(14px,env(safe-area-inset-left));
    padding-right:max(14px,env(safe-area-inset-right));
    padding-bottom:calc(var(--footer-height) + 36px + env(safe-area-inset-bottom));
    overflow-x:hidden;
}

.card{
    background:var(--card);
    width:100%;
    padding:16px;
    border-radius:16px;
    max-width:520px;
    margin:0 auto;
    box-shadow:0 0 20px rgba(0,242,255,0.7);
}

.logo-area{
    text-align:center;
    margin-bottom:10px;
}

.logo-area img{
    width:min(180px,80%);
    max-height:120px;
    object-fit:contain;
}

h2{
    text-align:center;
    color:var(--primary);
    font-size:clamp(1.25rem,6vw,1.55rem);
    line-height:1.25;
    overflow-wrap:anywhere;
}

label{
    margin-top:12px;
    display:block;
}

input,
select,
textarea{
    width:100%;
    min-height:46px;
    padding:12px;
    font-size:16px;
    border-radius:10px;
    border:1px solid #555;
    margin-top:5px;
    background:#0d1429;
    color:var(--text);
}

input:focus,
select:focus,
textarea:focus{
    outline:2px solid var(--primary);
    outline-offset:2px;
}

textarea{
    min-height:92px;
    resize:vertical;
}

select option{
    background:#111933;
    color:#fff;
}

.resultado{
    margin-top:15px;
    background:rgba(0,0,0,0.2);
    padding:12px;
    border-radius:12px;
    overflow-wrap:anywhere;
}

.resultado:empty,
.historico:empty{
    display:none;
}

.preco-final{
    color:#00ff88;
    font-size:1.4em;
    text-align:center;
    line-height:1.3;
}

button{
    width:100%;
    min-height:46px;
    padding:13px;
    font-size:16px;
    margin-top:10px;
    border-radius:12px;
    border:none;
    font-weight:bold;
    cursor:pointer;
    touch-action:manipulation;
}

.btn-primary{
    background:var(--primary);
    color:#000;
}

.btn-danger{
    background:#f44336;
    color:#fff;
}

.btn-success{
    background:#22c55e;
    color:#06140b;
}

.historico{
    margin-top:15px;
    background:rgba(0,0,0,0.2);
    padding:10px;
    border-radius:12px;
    max-height:300px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overflow-wrap:anywhere;
}

.historico-toggle{
    margin-top:12px;
}

.historico-toggle label{
    display:flex;
    align-items:center;
    gap:8px;
    margin:0;
    cursor:pointer;
}

.historico-toggle input{
    width:auto;
    min-height:auto;
    margin:0;
    padding:0;
}

.social-links{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.social-links a,
.social-links button{
    flex:1;
    text-align:center;
    text-decoration:none;
    padding:14px;
    border-radius:12px;
    font-weight:bold;
    color:white;
    transition:0.3s;
    min-height:46px;
    margin-top:0;
}

@media (hover:hover){
    .social-links a:hover,
    .social-links button:hover{
        transform:scale(1.03);
    }
}

.instagram{
    background:linear-gradient(45deg,#833ab4,#fd1d1d,#fcb045);
}

.whatsapp{
    background:#25D366;
}

.ofertas{
    background:#ffd21f;
    color:#111933 !important;
}

.telegram{
    background:linear-gradient(135deg,#37aee2,#1e96c8);
    color:#fff;
}

.filamento-card{
    background:#0d1429;
    padding:14px 56px 14px 14px;
    border-radius:12px;
    margin-bottom:10px;
    border:1px solid #1c274d;
    position:relative;
}

.encomenda-card.concluida{

}

.encomenda-status{

}

}

.encomenda-actions{

    margin-top:12px;
}

.encomenda-actions button{
    flex:1;
    margin-top:0;
}

.btn-lixeira{

    color:#ff4d4d;

    height:38px;
    border-radius:10px;

    top:10px;
    right:10px;

}

@media (hover:hover){

        background:#ff4d4d;
        color:#fff;
        transform:scale(1.08);
    }
}

footer{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    min-height:var(--footer-height);
    background:#000;
    color:var(--primary);
    text-align:center;

    line-height:1.3;

hr{

}

.resumo-item{

    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
    border:1px solid #1c274d;
}

.coffee-panel{

    width:min(340px,calc(100vw - 36px));
    background:#0d1429;
    border:1px solid var(--primary);
    border-radius:12px;
    padding:14px;
    box-shadow:0 10px 32px rgba(0,0,0,0.45);
    z-index:21;
}

.stl-panel{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(380px,calc(100vw - 36px));
    max-height:80vh;
    overflow-y:auto;
    background:#0d1429;
    border:1px solid #37aee2;
    border-radius:12px;
    padding:14px;
    box-shadow:0 10px 32px rgba(0,0,0,0.5);
    z-index:22;
}

.coffee-panel[hidden],
.stl-panel[hidden]{
    display:none;
}

.coffee-panel p{
    margin:0 0 10px;
    line-height:1.4;
}

.coffee-key{
    width:100%;
    background:#111933;
    border:1px solid #1c274d;
    border-radius:10px;
    padding:10px;
    margin-bottom:10px;
    font-weight:bold;
    letter-spacing:0;
    color:#fff;
    font-size:16px;
}

.coffee-status{
    min-height:18px;
    margin:0 0 10px;
    color:var(--primary);
    font-size:13px;
    line-height:1.35;
}

.coffee-actions{
    display:flex;
    gap:8px;
}

.coffee-actions button{
    flex:1;
    margin-top:0;
}

.coffee-close{
    background:#1c274d;
    color:#fff;
}

.stl-panel h3{
    margin:0 0 12px;
    color:var(--primary);
    text-align:center;
}

.stl-link{
    display:block;
    width:100%;
    background:#111933;
    border:1px solid #1c274d;
    border-radius:10px;
    color:#fff;
    text-decoration:none;
    padding:12px;
    margin-bottom:10px;
}

.stl-link strong{
    display:block;
    color:#37aee2;
    margin-bottom:4px;
}

.stl-empty{
    color:#d7e3ff;
    line-height:1.4;
}

.footer-coffee{
    width:auto;
    min-height:30px;
    padding:6px 10px;
    margin:6px 0 0;
    border-radius:8px;
    background:#111933;
    color:var(--primary);
    border:1px solid rgba(0,242,255,0.45);
    font-size:13px;
    box-shadow:none;
}

@media (max-width:420px){
    body{
        padding-top:10px;
    }

    .card{
        padding:14px;
        border-radius:12px;
        box-shadow:0 0 14px rgba(0,242,255,0.55);
    }

    .social-links{
        flex-direction:column;
    }
}

</style>
</head>

<script>

const DB_NAME = "venix3d_db";
const DB_VERSION = 3;

const STORE_HISTORICO = "historico";
const STORE_FILAMENTOS = "filamentos";
const STORE_ENCOMENDAS = "encomendas";
const LS_KEYS = {
    [STORE_HISTORICO]:"venix3d_historico",
    [STORE_FILAMENTOS]:"venix3d_filamentos",
    [STORE_ENCOMENDAS]:"venix3d_encomendas"
};
const STL_GROUPS = [
    {
        nome:"Rede Stl/3mf Brasil",
        descricao:"Grupo no Telegram",
        url:"https://t.me/redestlbrasil"
    },
    {
        nome:"STL do Solitário",
        descricao:"Grupo no Telegram",
        url:"https://t.me/STLsolitario"
    },
    {
        nome:"PokemonSTL",
        descricao:"Grupo no Telegram",
        url:"https://t.me/PokemonSTL"
    },
    {
        nome:"3D e STL SEM FREXCURA",
        descricao:"Grupo no Telegram",
        url:"https://t.me/impressoresbrasil"
    },
    {
        nome:"BMCU - AMS ALTERNATIVO",
        descricao:"Grupo no Telegram",
        url:"https://t.me/BMCU_Brasil"
    },
    {
        nome:"AUTOMOTIVO / BARCOS",
        descricao:"Grupo no Telegram",
        url:"https://t.me/AutomotiveGroup"
    },
    {
        nome:"3D COSPLAYS E FIGURAS",
        descricao:"Grupo no Telegram",
        url:"https://t.me/Printing3DCosplayStaticFigure"
    },
    {
        nome:"ARQUIVOS 3D STARTX",
        descricao:"Grupo no Telegram",
        url:"https://t.me/Arquivos3dstl"
    },
    {
        nome:"EVERY STL",
        descricao:"Grupo no Telegram",
        url:"https://t.me/GroupSTL"
    }
];

const LUCRO_FIXO = 120;

let db = null;
let usarLocalStorage = false;
let historico = [];

function lerNumero(id){

    const valor = document.getElementById(id).value.trim().replace(",",".");

    return parseFloat(valor);
}

function formatarPeso(valor){

    return String(valor).replace(".",",");
}

function escaparHtml(texto){

    return String(texto || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function armazenamentoPronto(){

    return db || usarLocalStorage;
}

function lerListaLocal(storeName){

    try{
        return JSON.parse(localStorage.getItem(LS_KEYS[storeName])) || [];
    }catch(error){
        console.error(error);
        return [];
    }
}

function salvarListaLocal(storeName,itens){

    localStorage.setItem(LS_KEYS[storeName],JSON.stringify(itens));
}

function proximoId(itens){

    if(itens.length === 0) return 1;

    return Math.max(...itens.map(item=>Number(item.id) || 0)) + 1;
}

function executarTransacao(storeName, mode, callback){

    return new Promise((resolve,reject)=>{

        if(usarLocalStorage){

            try{
                const itens = lerListaLocal(storeName);
                const store = {
                    add(item){
                        itens.push({
                            ...item,
                            id:proximoId(itens)
                        });
                    },
                    clear(){
                        itens.length = 0;
                    },
                    delete(id){
                        const index = itens.findIndex(item=>Number(item.id) === Number(id));

                        if(index >= 0){
                            itens.splice(index,1);
                        }
                    },
                    put(item){
                        const index = itens.findIndex(registro=>Number(registro.id) === Number(item.id));

                        if(index >= 0){
                            itens[index] = item;
                        }else{
                            itens.push({
                                ...item,
                                id:item.id || proximoId(itens)
                            });
                        }
                    }
                };

                callback(store);
                salvarListaLocal(storeName,itens);
                resolve();
            }catch(error){
                reject(error);
            }

            return;
        }

        const transaction = db.transaction(storeName,mode);
        const store = transaction.objectStore(storeName);

        callback(store);

        transaction.oncomplete = ()=>resolve();
        transaction.onerror = ()=>reject(transaction.error);
        transaction.onabort = ()=>reject(transaction.error);
    });
}

function buscarTodos(storeName){

    return new Promise((resolve,reject)=>{

        if(usarLocalStorage){
            resolve(lerListaLocal(storeName));
            return;
        }

        const transaction = db.transaction(storeName,"readonly");
        const store = transaction.objectStore(storeName);
        const request = store.getAll();

        request.onsuccess = ()=>resolve(request.result);
        request.onerror = ()=>reject(request.error);
    });
}

async function abrirBanco(){

    return new Promise((resolve,reject)=>{

        if(!window.indexedDB){
            reject(new Error("Este navegador não permite salvar dados locais."));
            return;
        }

        let request;

        try{
            request = indexedDB.open(DB_NAME,DB_VERSION);
        }catch(error){
            usarLocalStorage = true;
            console.error(error);
            resolve(null);
            return;
        }

        request.onupgradeneeded = (event)=>{

            const database = event.target.result;

            if(!database.objectStoreNames.contains(STORE_HISTORICO)){

                database.createObjectStore(STORE_HISTORICO,{
                    keyPath:"id",
                    autoIncrement:true
                });
            }

            if(!database.objectStoreNames.contains(STORE_FILAMENTOS)){

                database.createObjectStore(STORE_FILAMENTOS,{
                    keyPath:"id",
                    autoIncrement:true
                });
            }

            if(!database.objectStoreNames.contains(STORE_ENCOMENDAS)){

                database.createObjectStore(STORE_ENCOMENDAS,{
                    keyPath:"id",
                    autoIncrement:true
                });
            }
        };

        request.onsuccess = ()=>resolve(request.result);

        request.onerror = ()=>{
            usarLocalStorage = true;
            console.error(request.error);
            resolve(null);
        };
    });
}

async function inicializar(){

    try{
        db = await abrirBanco();
    }catch(error){
        usarLocalStorage = true;
        console.error(error);
    }

    try{
        await carregarHistorico();
        await carregarFilamentos();
        await carregarEncomendas();
    }catch(error){
        alert("Nao foi possivel carregar os dados salvos neste navegador.");
        console.error(error);
    }
}

async function calcular(){

    if(!armazenamentoPronto()){
        alert("O armazenamento ainda não foi iniciado.");
        return;
    }

    let nomeObjeto = document.getElementById("nomeObjeto").value.trim();

    let peso = lerNumero("peso");

    let tempo = lerNumero("tempo");

    let precoKg = lerNumero("precoKg");

    let custoHora = lerNumero("custoHora");

    let energia = lerNumero("energia");

    let consumo = lerNumero("consumo");

    if(isNaN(peso) || isNaN(tempo)){

        alert("Preencha peso e tempo corretamente.");

        return;
    }

    precoKg = isNaN(precoKg) ? 0 : precoKg;
    custoHora = isNaN(custoHora) ? 0 : custoHora;
    energia = isNaN(energia) ? 0 : energia;
    consumo = isNaN(consumo) ? 0 : consumo;

    let custoFilamento = (precoKg / 1000) * peso;

    let custoMaquina = tempo * custoHora;

    let custoEnergia = tempo * consumo * energia;

    let custoTotal = custoFilamento + custoMaquina + custoEnergia;

    let precoFinal = custoTotal * (1 + LUCRO_FIXO / 100);

    document.getElementById("resultado").innerHTML = `

        <p><strong>Produto:</strong> ${nomeObjeto || "Sem nome"}</p>

        <p>Filamento: R$ ${custoFilamento.toFixed(2)}</p>

        <p>Máquina: R$ ${custoMaquina.toFixed(2)}</p>

        <p>Energia: R$ ${custoEnergia.toFixed(2)}</p>

        <hr>

        <div class="preco-final">
            Preço Final: R$ ${precoFinal.toFixed(2)}
        </div>
    `;

    let registro = {
        texto: `${nomeObjeto || "Sem nome"} | ${peso}g | ${tempo}h | R$ ${precoFinal.toFixed(2)}`
    };

    await executarTransacao(STORE_HISTORICO,"readwrite",(store)=>{
        store.add(registro);
    });

    await carregarHistorico();
}

async function carregarHistorico(){

    historico = await buscarTodos(STORE_HISTORICO);

    atualizarHistorico();
}

function atualizarHistorico(){

    const mostrar = document.getElementById("mostrarHistorico").checked;

    const div = document.getElementById("historico");

    if(!mostrar || historico.length === 0){

        div.innerHTML = "";

        return;
    }

    div.innerHTML = "<b>Histórico:</b><br><br>";

    [...historico].reverse().forEach(item=>{

        div.innerHTML += `
            - ${item.texto}<br><br>
        `;
    });
}

async function limparHistorico(){

    if(!armazenamentoPronto()){
        alert("O armazenamento ainda não foi iniciado.");
        return;
    }

    if(!confirm("Deseja apagar o histórico?")) return;

    await executarTransacao(STORE_HISTORICO,"readwrite",(store)=>{
        store.clear();
    });

    historico = [];

    atualizarHistorico();

    document.getElementById("resultado").innerHTML = "";
}

async function salvarFilamento(){

    if(!armazenamentoPronto()){
        alert("O armazenamento ainda não foi iniciado.");
        return;
    }

    let nome = document.getElementById("filamentoNome").value.trim();

    let material = document.getElementById("filamentoMaterial").value.trim().toUpperCase();

    let cor = document.getElementById("filamentoCor").value;

    let peso = document.getElementById("filamentoPeso").value.trim().replace(",",".");

    let status = document.getElementById("filamentoStatus").value;

    if(!nome || !material || !cor || !peso){

        alert("Preencha todos os dados.");

        return;
    }

    await executarTransacao(STORE_FILAMENTOS,"readwrite",(store)=>{
        store.add({
            nome,
            material,
            cor,
            peso,
            status
        });
    });

    document.getElementById("filamentoNome").selectedIndex = 0;
    document.getElementById("filamentoMaterial").selectedIndex = 0;
    document.getElementById("filamentoCor").selectedIndex = 0;
    document.getElementById("filamentoPeso").value = "";

    await carregarFilamentos();
}

async function excluirFilamento(id){

    if(!armazenamentoPronto()){
        alert("O armazenamento ainda não foi iniciado.");
        return;
    }

    if(!confirm("Deseja remover este filamento do estoque?")){
        return;
    }

    await executarTransacao(STORE_FILAMENTOS,"readwrite",(store)=>{
        store.delete(id);
    });

    await carregarFilamentos();
}

async function carregarFilamentos(){

    const itens = await buscarTodos(STORE_FILAMENTOS);

    const div = document.getElementById("estoqueFilamentos");

    const resumo = document.getElementById("resumoFilamentos");

    if(itens.length === 0){

        div.innerHTML = "";

        resumo.innerHTML = "";

        return;
    }

    div.innerHTML = "<b>Estoque Atual:</b><br><br>";

    let abertos = 0;
    let lacrados = 0;

    let materiaisAbertos = {};
    let materiaisLacrados = {};
    let coresAbertas = {};
    let coresLacradas = {};

    [...itens].reverse().forEach(item=>{

        if(item.status === "Aberto"){

            abertos++;

            if(!materiaisAbertos[item.material]){
                materiaisAbertos[item.material] = 0;
            }

            materiaisAbertos[item.material]++;

            if(item.cor){

                if(!coresAbertas[item.cor]){
                    coresAbertas[item.cor] = 0;
                }

                coresAbertas[item.cor]++;
            }

        }else{

            lacrados++;

            if(!materiaisLacrados[item.material]){
                materiaisLacrados[item.material] = 0;
            }

            materiaisLacrados[item.material]++;

            if(item.cor){

                if(!coresLacradas[item.cor]){
                    coresLacradas[item.cor] = 0;
                }

                coresLacradas[item.cor]++;
            }
        }

        div.innerHTML += `

        <div class="filamento-card">

            <button
            class="btn-lixeira"
            type="button"
            onclick="excluirFilamento(${item.id})"
            title="Excluir filamento"
            aria-label="Excluir filamento">
            X
            </button>

            <b>${item.nome}</b><br><br>

            Material: ${item.material}<br>

            Cor: ${item.cor || "Não informada"}<br>

            Peso: ${formatarPeso(item.peso)}g<br>

            Status: ${item.status}

        </div>
        `;
    });

    let htmlResumo = `

    <h3 style="color:#00f2ff;text-align:center;">
        Resumo do Estoque
    </h3>

    <div class="resumo-item">
        <b>Filamentos Abertos:</b> ${abertos}<br><br>
    `;

    for(let material in materiaisAbertos){

        htmlResumo += `
            - ${material}: ${materiaisAbertos[material]} aberto(s)<br>
        `;
    }

    htmlResumo += `<br><b>Cores abertas:</b><br>`;

    if(Object.keys(coresAbertas).length === 0){

        htmlResumo += `Nenhuma cor aberta cadastrada<br>`;

    }else{

        for(let cor in coresAbertas){

            htmlResumo += `
                - ${cor}: ${coresAbertas[cor]} aberto(s)<br>
            `;
        }
    }

    htmlResumo += `
    </div>

    <div class="resumo-item">
        <b>Filamentos Lacrados:</b> ${lacrados}<br><br>
    `;

    for(let material in materiaisLacrados){

        htmlResumo += `
            - ${material}: ${materiaisLacrados[material]} lacrado(s)<br>
        `;
    }

    htmlResumo += `<br><b>Cores lacradas:</b><br>`;

    if(Object.keys(coresLacradas).length === 0){

        htmlResumo += `Nenhuma cor lacrada cadastrada<br>`;

    }else{

        for(let cor in coresLacradas){

            htmlResumo += `
                - ${cor}: ${coresLacradas[cor]} lacrado(s)<br>
            `;
        }
    }

    htmlResumo += `
    </div>
    `;

    resumo.innerHTML = htmlResumo;
}

async function salvarEncomenda(){

    if(!armazenamentoPronto()){
        alert("O armazenamento ainda não foi iniciado.");
        return;
    }

    const cliente = document.getElementById("encomendaCliente").value.trim();
    const objeto = document.getElementById("encomendaObjeto").value.trim();
    const observacao = document.getElementById("encomendaObs").value.trim();

    if(!cliente || !objeto){
        alert("Preencha cliente e objeto da encomenda.");
        return;
    }

    await executarTransacao(STORE_ENCOMENDAS,"readwrite",(store)=>{
        store.add({
            cliente,
            objeto,
            observacao,
            concluida:false,
            criadaEm:new Date().toISOString()
        });
    });

    document.getElementById("encomendaCliente").value = "";
    document.getElementById("encomendaObjeto").value = "";
    document.getElementById("encomendaObs").value = "";

    await carregarEncomendas();
}

async function carregarEncomendas(){

    const encomendas = await buscarTodos(STORE_ENCOMENDAS);
    const div = document.getElementById("listaEncomendas");

    if(encomendas.length === 0){
        div.innerHTML = "";
        return;
    }

    div.innerHTML = "<b>Encomendas Salvas:</b><br><br>";

    [...encomendas].reverse().forEach(item=>{

        const data = item.criadaEm
        ? new Date(item.criadaEm).toLocaleDateString("pt-BR")
        : "Sem data";

        const statusTexto = item.concluida ? "Concluída" : "Pendente";
        const acaoTexto = item.concluida ? "Reabrir" : "Concluir";

        div.innerHTML += `
        <div class="filamento-card encomenda-card ${item.concluida ? "concluida" : ""}">
            <b>${escaparHtml(item.objeto)}</b><br><br>
            Cliente: ${escaparHtml(item.cliente)}<br>
            Data: ${data}<br>
            ${item.observacao ? `Observação: ${escaparHtml(item.observacao)}<br>` : ""}
            <span class="encomenda-status">${statusTexto}</span>

            <div class="encomenda-actions">
                <button
                class="btn-success"
                type="button"
                onclick="alternarEncomenda(${item.id})">
                    ${acaoTexto}
                </button>

                <button
                class="btn-danger"
                type="button"
                onclick="excluirEncomenda(${item.id})">
                    Excluir
                </button>
            </div>
        </div>
        `;
    });
}

async function alternarEncomenda(id){

    if(!armazenamentoPronto()){
        alert("O armazenamento ainda não foi iniciado.");
        return;
    }

    const encomendas = await buscarTodos(STORE_ENCOMENDAS);
    const encomenda = encomendas.find(item=>Number(item.id) === Number(id));

    if(!encomenda) return;

    encomenda.concluida = !encomenda.concluida;
    encomenda.concluidaEm = encomenda.concluida ? new Date().toISOString() : "";

    await executarTransacao(STORE_ENCOMENDAS,"readwrite",(store)=>{
        store.put(encomenda);
    });

    await carregarEncomendas();
}

async function excluirEncomenda(id){

    if(!armazenamentoPronto()){
        alert("O armazenamento ainda não foi iniciado.");
        return;
    }

    if(!confirm("Deseja excluir esta encomenda?")) return;

    await executarTransacao(STORE_ENCOMENDAS,"readwrite",(store)=>{
        store.delete(id);
    });

    await carregarEncomendas();
}

function abrirGruposStl(){

    const panel = document.getElementById("stlPanel");
    const links = document.getElementById("stlLinks");

    if(STL_GROUPS.length === 0){
        links.innerHTML = `
            <p class="stl-empty">
                Nenhum grupo cadastrado ainda. Envie os links dos grupos para eu colocar aqui.
            </p>
        `;

        STL_GROUPS.forEach(grupo=>{

}

    document.getElementById("stlPanel").hidden = true;
}

function abrirCafe(){

    document.getElementById("coffeePanel").hidden = false;
    document.getElementById("coffeeStatus").textContent = "";
}

function fecharCafe(){

    document.getElementById("coffeePanel").hidden = true;
}

function selecionarPix(){

    const input = document.getElementById("pixKey");
    const chave = input.value.trim();

    input.focus();
    input.select();
    input.setSelectionRange(0,chave.length);
}

async function copiarPix(){

    const input = document.getElementById("pixKey");
    const status = document.getElementById("coffeeStatus");
    const chave = input.value.trim();

    selecionarPix();

    try{
        if(navigator.clipboard){
            await navigator.clipboard.writeText(chave);
        }else{
            const copiado = document.execCommand("copy");

            if(!copiado){
                throw new Error("Copia bloqueada pelo navegador.");
            }
        }

        status.textContent = "Chave Pix copiada.";
    }catch(error){
        console.error(error);
        status.textContent = "Cópia automática bloqueada. A chave ficou selecionada: toque e segure nela, depois escolha Copiar.";
    }
}

document
.getElementById("mostrarHistorico")
.addEventListener("change", atualizarHistorico);

inicializar();
